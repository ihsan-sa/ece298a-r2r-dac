# Tiny Tapeout project information. Draft: lands at the repository root as
# info.yaml (see tt_project/README.md). top_module, tiles and analog_pins must
# match blocks/r2r_dac/top/harden/info.yaml; tests/check_tt_project.py checks
# that once this file is at the root. Check the field names against the
# template's own info.yaml before landing it.
project:
  title:        "R-2R DAC"
  author:       ""      # TODO(owner): your name as it should appear on the shuttle
  discord:      ""      # optional
  description:  "8-bit R-2R DAC with load, ramp, sine and hold modes"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "1x2"
  analog_pins: 1
  uses_3v3: true

  top_module:  "tt_um_r2r_dac_digital"

  source_files:
    - "project.v"
    - "r2r_dac_digital.v"
    - "r2r_dac_analog.v"

pinout:
  # Inputs
  ui[0]: "code[0]"
  ui[1]: "code[1]"
  ui[2]: "code[2]"
  ui[3]: "code[3]"
  ui[4]: "code[4]"
  ui[5]: "code[5]"
  ui[6]: "code[6]"
  ui[7]: "code[7]"

  # Outputs
  uo[0]: "dac_code[0]"
  uo[1]: "dac_code[1]"
  uo[2]: "dac_code[2]"
  uo[3]: "dac_code[3]"
  uo[4]: "dac_code[4]"
  uo[5]: "dac_code[5]"
  uo[6]: "dac_code[6]"
  uo[7]: "dac_code[7]"

  # Bidirectional pins (all used as inputs)
  uio[0]: "mode[0]"
  uio[1]: "mode[1]"
  uio[2]: "slow"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins
  ua[0]: "vout"
  ua[1]: ""
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

yaml_version: 6
